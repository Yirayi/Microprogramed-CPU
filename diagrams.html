<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #eee; }

.tabs { display: flex; background: #16213e; border-bottom: 2px solid #0f3460; }
.tab { padding: 14px 32px; cursor: pointer; font-size: 16px; font-weight: bold;

.page { display: none; padding: 30px 40px; }
.page.active { display: block; }

h2 { font-size: 22px; color: #e2e8f0; margin-bottom: 24px; text-align: center;

/* ── Legend ── */
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 28px;
          justify-content: center; }
.leg-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e0; }
.leg-box { width: 22px; height: 18px; border-radius: 4px; }
.leg-box.module   { background: #4fc3f7; }
.leg-box.register { background: #ffb74d; border-radius: 0; transform: skewX(-10deg); }
.leg-box.memory   { background: #ce93d8; border: 2px solid #ab47bc; }
.leg-box.buffer   { background: #80cbc4; border-radius: 50%; width: 18px; height: 18px; }
.leg-box.panel    { background: #a5d6a7; }
.leg-box.control  { background: #fff176; border: 1px solid #f9a825; }

/* ── Diagram containers ── */
svg { display: block; margin: 0 auto; overflow: visible; }

/* shapes via SVG */
</style>
</head>
