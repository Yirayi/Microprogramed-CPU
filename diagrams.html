<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Microprogrammed CPU Diagrams</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }

  /* Nav */
  .nav { display: flex; gap: 8px; padding: 14px 20px; background: #161b22; border-bottom: 2px solid #30363d; position: sticky; top: 0; z-index: 100; }
  .nav button { padding: 8px 18px; border: 1px solid #30363d; border-radius: 20px; background: #21262d; color: #8b949e; cursor: pointer; font-size: 14px; transition: all .2s; }
  .nav button.active, .nav button:hover { background: #388bfd; color: #fff; border-color: #388bfd; }

  /* Pages */
  .page { display: none; padding: 24px; }
  .page.active { display: block; }
  h2 { font-size: 22px; margin-bottom: 6px; color: #79c0ff; }
  .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 24px; }

  /* Legend */
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px 16px; background: #161b22; border-radius: 8px; border: 1px solid #30363d; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .lbox { width: 28px; height: 18px; border-radius: 4px; }
  .lbox-round { width: 28px; height: 18px; border-radius: 9px; }
  .lbox-diamond { width: 20px; height: 20px; transform: rotate(45deg); }
  .larrow-solid { width: 40px; height: 2px; background: #58a6ff; position: relative; }
  .larrow-solid::after { content:''; position:absolute; right:-6px; top:-4px; border:5px solid transparent; border-left-color:#58a6ff; }
  .larrow-dash { width: 40px; height: 0; border-top: 2px dashed #f0883e; position: relative; }
  .larrow-dash::after { content:''; position:absolute; right:-6px; top:-4px; border:5px solid transparent; border-left-color:#f0883e; }

  /* SVG container */
  .diagram-wrap { overflow: auto; }
  svg { display: block; }

  /* Shape styles in SVG are inline */
</style>
</head>
<body>

<div class="nav">
  <button class="active" onclick="show(0)">① VGA 数据获取</button>
  <button onclick="show(1)">② 键盘指令注入</button>
</div>

<!-- ============================================================ PAGE 1: VGA ============================================================ -->
<div class="page active" id="p0">
  <h2>VGA 如何获取各个应该显示的数据</h2>
  <p class="subtitle">vga_display 模块从多个来源汇聚数据，渲染 640×480 四面板调试界面</p>

  <div class="legend">
    <div class="legend-item"><div class="lbox" style="background:#1f6feb;border:2px solid #388bfd"></div> 功能模块</div>
    <div class="legend-item"><div class="lbox" style="background:#7d4e00;border:2px solid #e3b341"></div> 寄存器 / 存储器</div>
    <div class="legend-item"><div class="lbox" style="background:#1a4a2e;border:2px solid #3fb950"></div> 输出设备</div>

    <div class="legend-item"><div class="larrow-dash"></div> 控制信号（虚线）</div>
  </div>

  <div class="diagram-wrap">
  <svg width="1100" height="760" xmlns="http://www.w3.org/2000/svg" style="font-family:'Segoe UI',sans-serif;">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
      </marker>
      <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f0883e"/>
      </marker>
      <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
      </marker>
      <marker id="arr-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#e3b341"/>
      </marker>
    </defs>

    <!-- ─── CPU_top module (left column) ─── -->
    <rect x="20" y="20" width="200" height="50" rx="10" fill="#1f3a5f" stroke="#388bfd" stroke-width="2"/>
    <text x="120" y="50" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="bold">CPU_top</text>

    <!-- Registers group -->
    <rect x="20" y="100" width="200" height="380" rx="6" fill="#1a1f2e" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="120" y="122" text-anchor="middle" fill="#8b949e" font-size="12">寄存器组</text>

    <!-- individual registers -->
    <g id="regs">
      <!-- PC -->
      <rect x="40" y="132" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="76" y="152" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">PC (8b)</text>
      <!-- MAR -->
      <rect x="40" y="172" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="76" y="192" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">MAR (8b)</text>
      <!-- IR -->
      <rect x="40" y="212" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="76" y="232" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">IR (8b)</text>
      <!-- CAR -->
      <rect x="40" y="252" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="76" y="272" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">CAR (8b)</text>
      <!-- MBR -->
      <rect x="130" y="132" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="166" y="152" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">MBR (16b)</text>
      <!-- BR -->
      <rect x="130" y="172" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="166" y="192" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">BR (16b)</text>
      <!-- ACC -->
      <rect x="130" y="212" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="166" y="232" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">ACC (16b)</text>
      <!-- MR -->
      <rect x="130" y="252" width="72" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
      <text x="166" y="272" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">MR (16b)</text>
    </g>

    <!-- port_in / port_out -->
    <rect x="40" y="302" width="160" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
    <text x="120" y="322" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">port_in[0..3] / port_out[0..3]</text>

    <!-- micro_instr from ControlMemory -->
    <rect x="40" y="342" width="160" height="30" rx="4" fill="#7d4e00" stroke="#e3b341" stroke-width="1.5"/>
    <text x="120" y="362" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">micro_instr (32b)</text>

    <!-- halted flag -->

    <text x="120" y="401" text-anchor="middle" fill="#e3b341" font-size="13">halted flag</text>

    <!-- ─── video_bus wide arrow ─── -->

    <line x1="220" y1="290" x2="380" y2="290" stroke="#58a6ff" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="245" y="270" width="120" height="38" rx="6" fill="#0d2044" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="305" y="286" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">video_bus</text>
    <text x="305" y="300" text-anchor="middle" fill="#79c0ff" font-size="11">209-bit 总线</text>

    <!-- ─── Instruction Memory (IM) ─── -->
    <rect x="20" y="500" width="200" height="44" rx="6" fill="#2d1f7d" stroke="#9b59b6" stroke-width="2"/>
    <text x="120" y="518" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="bold">Instruction Memory</text>
    <text x="120" y="536" text-anchor="middle" fill="#9b59b6" font-size="12">256×16 BRAM (IM)</text>

    <!-- startup scan FSM arrow from IM -->
    <line x1="220" y1="522" x2="300" y2="522" stroke="#e3b341" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-y)"/>
    <!-- scan FSM box -->
    <rect x="300" y="500" width="140" height="44" rx="6" fill="#2a1f00" stroke="#e3b341" stroke-width="2"/>
    <text x="370" y="518" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Startup Scan FSM</text>
    <text x="370" y="534" text-anchor="middle" fill="#8b949e" font-size="11">scan_wr_en/addr/data</text>

    <!-- scan FSM → vga -->
    <line x1="440" y1="522" x2="530" y2="440" stroke="#e3b341" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-y)"/>
    <text x="500" y="498" fill="#e3b341" font-size="11">扫描写入</text>
    <text x="500" y="512" fill="#8b949e" font-size="10">程序列表初始化</text>

    <!-- SW[11:0] input -->
    <rect x="20" y="580" width="200" height="36" rx="6" fill="#1a3a2e" stroke="#3fb950" stroke-width="2"/>
    <text x="120" y="604" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">SW[11:0] 拨码开关</text>

    <!-- SW → port_in -->
    <line x1="120" y1="580" x2="120" y2="332" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <text x="125" y="456" fill="#3fb950" font-size="11">port_in[0]</text>

    <!-- ─── exec_mode / halted ─── -->
    <rect x="20" y="640" width="200" height="36" rx="6" fill="#1a2a3a" stroke="#388bfd" stroke-width="1.5"/>
    <text x="120" y="664" text-anchor="middle" fill="#79c0ff" font-size="13">SW[15:14] exec_mode</text>

    <!-- exec_mode → vga (dashed) -->
    <line x1="220" y1="658" x2="530" y2="540" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>

    <!-- ─── vga_display module (center) ─── -->
    <rect x="530" y="160" width="220" height="420" rx="12" fill="#1f3a5f" stroke="#388bfd" stroke-width="2.5"/>
    <text x="640" y="185" text-anchor="middle" fill="#79c0ff" font-size="16" font-weight="bold">vga_display</text>
    <line x1="540" y1="196" x2="740" y2="196" stroke="#388bfd" stroke-width="1"/>

    <!-- panels inside vga -->
    <rect x="548" y="206" width="194" height="54" rx="4" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
    <text x="645" y="225" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">右侧面板 (Right Panel)</text>
    <text x="645" y="242" text-anchor="middle" fill="#8b949e" font-size="11">PC, MAR, IR, CAR, MBR</text>
    <text x="645" y="256" text-anchor="middle" fill="#8b949e" font-size="11">BR, ACC, MR, MI, ports</text>

    <rect x="548" y="272" width="194" height="44" rx="4" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
    <text x="645" y="292" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">中间面板 (Middle Panel)</text>
    <text x="645" y="308" text-anchor="middle" fill="#8b949e" font-size="11">程序指令列表 + PC高亮</text>

    <rect x="548" y="328" width="194" height="44" rx="4" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
    <text x="645" y="348" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">左上面板 (History Panel)</text>
    <text x="645" y="364" text-anchor="middle" fill="#8b949e" font-size="11">执行历史环形缓冲×32条</text>

    <rect x="548" y="384" width="194" height="44" rx="4" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
    <text x="645" y="404" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">左下面板 (KB Input)</text>
    <text x="645" y="420" text-anchor="middle" fill="#8b949e" font-size="11">键盘输入区 + 光标</text>

    <rect x="548" y="440" width="194" height="38" rx="4" fill="#0d2044" stroke="#9b59b6" stroke-width="1"/>
    <text x="645" y="458" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="bold">8×8 分布式 ROM 字体</text>
    <text x="645" y="472" text-anchor="middle" fill="#8b949e" font-size="11">47字符 · LUT实现</text>

    <rect x="548" y="490" width="194" height="38" rx="4" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
    <text x="645" y="508" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">25MHz 像素时钟逻辑</text>
    <text x="645" y="524" text-anchor="middle" fill="#8b949e" font-size="11">100MHz ÷ 4 · H/V sync</text>

    <!-- video_bus → vga Right panel -->
    <line x1="380" y1="283" x2="548" y2="233" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="440" y="250" fill="#58a6ff" font-size="11">video_bus[209b]</text>

    <!-- capture_pulse dashed from ControlUnit area -->
    <rect x="300" y="580" width="160" height="36" rx="6" fill="#1f3a5f" stroke="#388bfd" stroke-width="1.5"/>
    <text x="380" y="604" text-anchor="middle" fill="#79c0ff" font-size="13">ControlUnit</text>
    <line x1="460" y1="598" x2="548" y2="395" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
    <text x="520" y="520" fill="#f0883e" font-size="11">capture_pulse</text>
    <text x="520" y="534" fill="#8b949e" font-size="10">触发历史记录</text>

    <!-- halted from ControlUnit → vga -->
    <line x1="460" y1="594" x2="548" y2="400" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>

    <!-- ─── VGA Output ─── -->
    <rect x="820" y="280" width="200" height="110" rx="10" fill="#1a3a2e" stroke="#3fb950" stroke-width="2.5"/>
    <text x="920" y="304" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">VGA 显示器</text>

    <text x="920" y="380" text-anchor="middle" fill="#8b949e" font-size="12">HSYNC · VSYNC</text>

    <!-- vga → VGA monitor -->
    <line x1="750" y1="370" x2="820" y2="335" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arr-g)"/>
    <text x="770" y="348" fill="#3fb950" font-size="12" font-weight="bold">像素信号</text>

    <rect x="820" y="440" width="200" height="60" rx="10" fill="#1a3a2e" stroke="#3fb950" stroke-width="2"/>

    <line x1="640" y1="320" x2="820" y2="470" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

<!-- ============================================================ PAGE 2: Keyboard Injection ============================================================ -->
<div class="page" id="p1">
  <h2>键盘输入的指令如何直接注入到 CPU 运行</h2>
  <p class="subtitle">仅在 Instr-Step 模式下可用；注入期间 PC 保持不变</p>

  <div class="legend">
    <div class="legend-item"><div class="lbox" style="background:#1f6feb;border:2px solid #388bfd"></div> 功能模块</div>
    <div class="legend-item"><div class="lbox" style="background:#7d4e00;border:2px solid #e3b341"></div> 寄存器 / 存储器</div>
    <div class="legend-item"><div class="lbox" style="background:#4a1a1a;border:2px solid #ff7b72"></div> 组合逻辑 / FSM 状态</div>
    <div class="legend-item"><div class="larrow-solid"></div> 数据流（实线）</div>
    <div class="legend-item"><div class="larrow-dash"></div> 控制信号（虚线）</div>
  </div>

  <div class="diagram-wrap">
  <svg width="1100" height="780" xmlns="http://www.w3.org/2000/svg" style="font-family:'Segoe UI',sans-serif;">
    <defs>
      <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/></marker>
      <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f0883e"/></marker>
      <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/></marker>
      <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff7b72"/></marker>
    </defs>

    <!-- ─── Step 1: Physical Keyboard ─── -->
    <rect x="20" y="60" width="140" height="50" rx="10" fill="#1a3a2e" stroke="#3fb950" stroke-width="2"/>
    <text x="90" y="82" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">PS/2 键盘</text>
    <text x="90" y="100" text-anchor="middle" fill="#8b949e" font-size="11">物理设备</text>

    <!-- keyboard → PS2_receiver -->
    <line x1="160" y1="85" x2="210" y2="85" stroke="#58a6ff" stroke-width="2" marker-end="url(#a1)"/>
    <text x="175" y="78" fill="#58a6ff" font-size="11">ps2_clk</text>
    <text x="175" y="95" fill="#58a6ff" font-size="11">ps2_data</text>

    <!-- ─── PS2_receiver ─── -->
    <rect x="210" y="54" width="160" height="62" rx="8" fill="#1f3a5f" stroke="#388bfd" stroke-width="2"/>
    <text x="290" y="76" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="bold">PS2_receiver</text>
    <text x="290" y="93" text-anchor="middle" fill="#8b949e" font-size="11">11-bit 帧解码</text>
    <text x="290" y="108" text-anchor="middle" fill="#8b949e" font-size="11">奇偶校验 · 1ms超时恢复</text>

    <!-- PS2_receiver → ps2_decoder -->
    <line x1="370" y1="85" x2="420" y2="85" stroke="#58a6ff" stroke-width="2" marker-end="url(#a1)"/>
    <text x="375" y="78" fill="#58a6ff" font-size="11">key_data[7:0]</text>
    <text x="375" y="97" fill="#58a6ff" font-size="11">key_valid</text>

    <!-- ─── ps2_decoder ─── -->
    <rect x="420" y="54" width="180" height="62" rx="8" fill="#1f3a5f" stroke="#388bfd" stroke-width="2"/>
    <text x="510" y="76" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="bold">ps2_decoder</text>
    <text x="510" y="93" text-anchor="middle" fill="#8b949e" font-size="11">Set-2 扫描码 → 字体索引</text>
    <text x="510" y="108" text-anchor="middle" fill="#8b949e" font-size="11">F0(break) / E0(extended) 处理</text>
